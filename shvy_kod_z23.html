    </p>

    <p id="pochylona_shvydkov">
        Shvydkov<br>
        Wchodzi programista do windy, a tam zamiast przycisków pięter jest konsola. Myśli sobie: "No tak, znowu brak interfejsu graficznego".
    </p>

    <p id="index_gorny_shvydkov">
        Shvydkov<br>

    </p>

    <p id="index_dolny_shvydkov">

    </p>

    <p id="mono_shvydkov">
        Shvydkov<br>
        Żona wysyła programistę do sklepu: "Kup kostkę masła, a jak będą jajka, kup dziesięć". Programista kupuje 10 kostek masła.
    </p>

    <p id="powiekszenie_shvydkov">
        Shvydkov<br>
